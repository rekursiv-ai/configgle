[project]
name = "ty-extensions"
version = "0.1.1"
description = "Polyfill for ty_extensions (a module built into the ty type checker)."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "rekursiv.ai"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ty_extensions"]
